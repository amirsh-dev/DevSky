<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stormy Weather Dashboard</title>

  <link rel="stylesheet" href="styles/app.css" />
</head>

<body>

  <main class="weather-dashboard">

    <aside class="sidebar">

      <header class="header">
            <h1 class="logo">DevSky</h1>
            <button
              class="theme theme-toggle"
              id="theme-toggle"
              type="button"
              aria-label="Switch to light theme"
              aria-pressed="false"
            >
              <span
                class="theme__icon theme__icon--dark"
                aria-hidden="true"
              >☾</span>

              <span
                class="theme__icon theme__icon--light"
                aria-hidden="true"
              >☀</span>

              <span
                class="theme-toggle__slider"
                aria-hidden="true"
              ></span>
            </button>
      </header>

      <section class="location-picker">
        <div class="location-picker__header">
          <label class="location-picker__label" for="location-search">Choose Location</label>
        </div>

        <div class="search-wrapper">
          <input
            id="location-search"
            class="search-input"
            type="search"
            placeholder="Search..."
            aria-label="Search location"
          />
        </div>

        <div
          id="search-results"
          class="search-results"
          aria-live="polite"
        ></div>
      </section>

      <article class="city city__card">
        <h2 class="city__name">Mumbai</h2>

        <div class="weather-icon" aria-hidden="true">🌧️</div>

        <div class="city__temperature">28°C</div>

        <div class="city__condition">
          <span class="city__condition-icon" aria-hidden="true">🌧️</span>
          <span>Rainy stormy clouds</span>
        </div>
      </article>

      <article class="city city__card">
        <h2 class="city__name">Visakhapatnam</h2>

        <div class="weather-icon" aria-hidden="true">🌤️</div>

        <div class="city__temperature">32°C</div>

        <div class="city__condition">
          <span class="city__condition-icon" aria-hidden="true">🌤️</span>
          <span>Partly cloudy</span>
        </div>
      </article>

      <article class="city city__card">
        <h2 class="city__name">Delhi</h2>

        <div class="weather-icon" aria-hidden="true">🌤️</div>

        <div class="city__temperature">34°C</div>

        <div class="city__condition">
          <span class="city__condition-icon" aria-hidden="true">🌤️</span>
          <span>Partly cloudy</span>
        </div>
      </article>

    </aside>

    <section class="main-content">
      
      <header class="weather-header">

        <div class="current-location">
          <div class="location-line">
            <span
              class="location-pin"
              aria-hidden="true"
            ></span>

            <span>
              Gujarat
              <span class="date">(Monday, June 10)</span>
            </span> 
          </div>

          <div class="temperature-row">
            <strong class="main-temperature">28°C</strong>

            <div class="high-low">
              <span>High 29</span>
              <span>Low 24</span>
            </div>
          </div>
          
        </div>

        <div class="stat-card">
          <span class="stat-label">Humidity</span>
          <span class="stat-value">84%</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Visibility</span>
          <span class="stat-value">5km</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Feels like</span>
          <span class="stat-value">32°C</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">UV index</span>
          <span class="stat-value">5.50<span class="stat-unit">uv</span></span>
        </div>

      </header>

      <section class="forecast">
        <h1 class="weather-status">
          Stormy<br />
          With Partly cloudy
        </h1>
      </section>

    </section>

  </main>

  <script src="scripts/app.js"></script>
</body>
</html>
